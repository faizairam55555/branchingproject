<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to SR University</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-box {
            background: white;
            width: 500px;
            padding: 50px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #1e3c72;
            font-size: 40px;
            margin-bottom: 15px;
        }

        h2 {
            color: #555;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #1e3c72;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #16305c;
        }

        footer {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="welcome-box">

        <h1>Welcome!</h1>

        <h2>SR University</h2>

        <p>
            Welcome to SR University.  
            We are happy to have you here.
        </p>

        <a href="login.html" class="btn">Get Started</a>

        <footer>
            © 2026 SR University. All Rights Reserved.
        </footer>

    </div>

</body>
</html>
